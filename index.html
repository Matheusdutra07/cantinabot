<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CantinaBot 4.0</title><style>*{box-sizing:border-box}body{background:#101a27;color:#edf4fa;font:16px system-ui;margin:0;padding:22px}main{max-width:600px;margin:auto}h1{margin-bottom:0}small{color:#aabccc}section{background:#172638;border:1px solid #30465a;border-radius:18px;padding:20px;margin:20px 0}label{display:block;margin:16px 0 7px}input,textarea,button,a{font:inherit;width:100%;border-radius:10px;padding:14px}input,textarea{background:#101a27;color:white;border:1px solid #465c70}textarea{background:#12392e;min-height:310px;resize:vertical}button,a{display:block;text-align:center;background:#53d5a0;color:#09291d;border:0;font-weight:bold;text-decoration:none;margin-top:12px;cursor:pointer}button.secondary{background:#30465a;color:white}button:disabled{opacity:.45}#status{color:#ffcc91}</style><main><h1>Cantina<span style="color:#53d5a0">Bot</span> 4.0</h1><small>Central de cobranças individuais</small><section><h2>Nova cobrança</h2><label for="n">Nome do cliente</label><input id="n" placeholder="Nome"><label for="p">WhatsApp com DDD</label><input id="p" type="tel" placeholder="21 90000-0000"><label for="v">Valor devido (R$)</label><input id="v" inputmode="decimal" placeholder="590,00"><label for="d">Prazo de pagamento (DD/MM/AA)</label><input id="d" value="30/11/26" placeholder="30/11/26" inputmode="numeric" maxlength="8"></section><section><h2>Mensagem de cobrança</h2><textarea id="m" readonly>Olá, [Nome]! Tudo bem?

Consta um saldo pendente de R$ [Valor] referente ao consumo na cantina.

Solicitamos, por gentileza, que o pagamento seja realizado até o dia 30/11/26.

Caso já tenha efetuado o pagamento, pedimos que desconsidere esta mensagem.

Agradecemos pela atenção e compreensão!

Atenciosamente,
Administração da Cantina.</textarea><button id="send" disabled>Enviar pelo WhatsApp</button><button class="secondary" id="copy">Copiar mensagem</button><button class="secondary" id="reset">Nova cobrança</button><p id="status" role="status"></p></section><small>Os dados não são armazenados pelo site. Confirme o destinatário e o envio no WhatsApp.</small><footer style="text-align:center;margin:28px 0 8px;color:#aabccc;font-size:14px">Desenvolvido por <strong style="color:#53d5a0">Matheus Dutra</strong></footer></main><script>
const $=id=>document.getElementById(id);let url='';function update(){const n=$('n').value.trim(),p=$('p').value.replace(/\D/g,''),raw=$('v').value.trim(),v=Number(raw.includes(',')?raw.replace(/\./g,'').replace(',','.'):raw),d=$('d').value;const parts=/^(\d{2})\/(\d{2})\/(\d{2})$/.exec(d);let dateOK=false;if(parts){const dt=new Date(2000+Number(parts[3]),Number(parts[2])-1,Number(parts[1]));dateOK=dt.getDate()===Number(parts[1])&&dt.getMonth()===Number(parts[2])-1;}const money=Number.isFinite(v)&&v>0?v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'R$ [Valor]';$('m').value=`Olá, ${n||'[Nome]'}! Tudo bem?\n\nConsta um saldo pendente de ${money} referente ao consumo na cantina.\n\nSolicitamos, por gentileza, que o pagamento seja realizado até o dia ${d||'[Data]'}.\n\nCaso já tenha efetuado o pagamento, pedimos que desconsidere esta mensagem.\n\nAgradecemos pela atenção e compreensão!\n\nAtenciosamente,\nAdministração da Cantina.`;const ok=n&&(/^[1-9]\d{10}$/.test(p)||/^55[1-9]\d{10}$/.test(p))&&Number.isFinite(v)&&v>0&&dateOK;url=ok?'https://wa.me/'+(p.length===11?'55'+p:p)+'?text='+encodeURIComponent($('m').value):'';$('send').disabled=!ok;}
['n','p','v','d'].forEach(id=>$(id).addEventListener('input',update));$('send').onclick=()=>{if(url)location.href=url};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('m').value);$('status').textContent='Mensagem copiada.'}catch(e){$('m').select();$('status').textContent='Selecione e copie a mensagem manualmente.'}};$('reset').onclick=()=>{['n','p','v'].forEach(id=>$(id).value='');$('status').textContent='';update();$('n').focus()};update();</script></html>
